services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/bitnami/minio/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${API_IMAGE}
    command: ["sh", "-c", "mkdir -p /app/data/assets && exec uvicorn backend.main:app --host 0.0.0.0 --port 11001 --proxy-headers"]
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      args:
        TORCH_INDEX: ${TORCH_INDEX:-cu128}
    restart: unless-stopped
    # 需要 GPU 推理时取消下行注释（宿主需安装 NVIDIA Container Toolkit）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    environment:
      CLUSTER_MODE: "1"
      VIDEOLINGO_REMOTE_MODE: ${VIDEOLINGO_REMOTE_MODE:-0}
      YUNZHIAI_SELF_USE: ${YUNZHIAI_SELF_USE:-1}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      VOICEFORGE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      VOICEFORGE_CELERY_RESULT_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      CONTROL_PLANE_CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      CONTROL_PLANE_CELERY_RESULT_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      # 模型缓存 / 任务数据 / 预览 落到挂载卷
      HF_HOME: /app/_model_cache
      TRANSFORMERS_CACHE: /app/_model_cache/transformers
    volumes:
      - app-data:/app/voiceforge_data
      - app-data-root:/app/data
      - app-model-cache:/app/_model_cache
      - app-temp:/app/temp
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "11001"
    ports:
      - "${API_PORT:-11001}:11001"
    healthcheck:
      # /api/health/ready 实测稳定耗时 7-8 秒（redis/celery/控制面/文件系统逐项检查累加），
      # 原 3 秒请求超时 + 5 秒探测超时太紧，健康的实例也会被误判 unhealthy。放宽到 15/20 秒。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11001/api/health/ready', timeout=15)"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 30s

  worker:
    image: ${API_IMAGE}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      args:
        TORCH_INDEX: ${TORCH_INDEX:-cu128}
    restart: unless-stopped
    command: ["celery", "-A", "backend.control_plane.celery_runtime.celery_app", "worker", "--loglevel=INFO", "--hostname=yunzhiai-worker@%h", "--pool=threads", "--concurrency=5", "--queues=videolingo_cpu,videolingo_gpu,videolingo_llm,videolingo_tts,videolingo_io"]
    # 需要 GPU 推理时取消下行注释（宿主需安装 NVIDIA Container Toolkit）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    environment:
      CLUSTER_MODE: "1"
      YUNZHIAI_SELF_USE: ${YUNZHIAI_SELF_USE:-1}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      VOICEFORGE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      VOICEFORGE_CELERY_RESULT_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      CONTROL_PLANE_CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      CONTROL_PLANE_CELERY_RESULT_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      HF_HOME: /app/_model_cache
      TRANSFORMERS_CACHE: /app/_model_cache/transformers
    volumes:
      - app-data:/app/voiceforge_data
      - app-data-root:/app/data
      - app-model-cache:/app/_model_cache
      - app-temp:/app/temp
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.control_plane.celery_runtime.celery_app inspect ping -d yunzhiai-worker@$$HOSTNAME --timeout=3 | grep -q pong"]
      interval: 15s
      timeout: 8s
      retries: 6

  voiceforge-worker:
    extends:
      service: worker
    command: ["celery", "-A", "backend.voiceforge.tasks.celery_app.celery_app", "worker", "--loglevel=INFO", "--hostname=voiceforge@%h", "--pool=threads", "--concurrency=5", "--queues=voiceforge_synthesis,voiceforge_voice,voiceforge_export"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.voiceforge.tasks.celery_app.celery_app inspect ping -d voiceforge@$$HOSTNAME --timeout=3 | grep -q pong"]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_FILE}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_FILE}:/etc/nginx/tls/privkey.pem:ro
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  app-data:
  app-data-root:
  app-model-cache:
  app-temp:
