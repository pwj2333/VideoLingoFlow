name: 云智AI Docker 发布

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "构建完成后通过 SSH 部署到服务器"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/yunzhiai-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          build-args: TORCH_INDEX=cpu
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -eu
            cd "${{ secrets.SERVER_APP_DIR }}"
            export API_IMAGE="${{ env.IMAGE }}:latest"
            export TORCH_INDEX="cpu"
            docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" -p "${{ secrets.GHCR_TOKEN }}"
            docker compose -f deploy/docker-compose.yml --env-file .env pull api worker voiceforge-worker
            docker compose -f deploy/docker-compose.yml --env-file .env up -d postgres redis minio
            docker compose -f deploy/docker-compose.yml --env-file .env run --rm --no-deps api alembic upgrade head
            docker compose -f deploy/docker-compose.yml --env-file .env up -d api worker voiceforge-worker proxy
            docker image prune -f
